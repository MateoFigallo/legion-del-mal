name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
          description: 'Que villano envia el mensaje?'
          required: true
          type: choice
          options:
            - Lex Luthor
            - Brainiac
            - Joker
            - Darkseid
            - Sinestro
      mensaje:
            description: 'Mensaje para el consejo'
            required: true
            default: "La mision fue un exito" 

      prioridad:
          description: 'Nivel de prioridad'
          required: true
          type: choice
          options:
            - 🟢Normal
            - 🟠Alta
            - 🔴Critica


jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay


      - name: Imprimir inputs
        run: |
          echo "==============================="
          echo "Transmision interceptada"
          echo "==============================="
          echo ""
          echo "De: ${{ github.event.inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M:%S UTC")"
          echo "------- Mensaje -------"
          cowsay -f eyes "${{ github.event.inputs.mensaje }}"
          echo ""
          echo "Prioridad: ${{ github.event.inputs.prioridad }}"