name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
          description: 'Que villano envia el mensaje?'
          required: true
          type: choice
          options:
            - Lex Luthor
            - Brainiac
            - Joker
            - Darkseid
            - Sinestro
      mensaje:
            description: 'Mensaje para el consejo'
            required: true
            default: "La mision fue un exito" 

      prioridad:
          description: 'Nivel de prioridad'
          required: true
          type: choice
          options:
            - 🟢Normal
            - 🟠Alta
            - 🔴Critica


jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4