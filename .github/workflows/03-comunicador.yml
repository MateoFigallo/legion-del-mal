name: Comunicador de la legion

on:
  workflow_dispatch:
    inputs:
      villano:
          description: 'Que villano envia el mensaje?'
          required: true
          type: choice
          options:
            - Lex Luthor
            - Brainiac
            - Joker
            - Darkseid
            - Sinestro

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4